name: Operational State Validation

on:
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - ".github/workflows/operational-state-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate live Azure security operations
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate operational state
        shell: pwsh
        run: |
          ./automation/scripts/Test-NorthStarOperationalState.ps1

      - name: Upload sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-operational-validation-${{ github.run_id }}
          path: evidence/operational-validation/latest.json
          if-no-files-found: error
          retention-days: 14
